name: weekly-digest

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC, the digest covers the previous full week
  workflow_dispatch:
  push:
    paths: ["src/**", "tests/**", "prompts/**", "data/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -v
      - name: quality gate on the gold set (recorded model answers, no key needed)
        run: PYTHONPATH=src python -m review_digest eval --provider replay --min-f1 0.85

  digest:
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=src python -m review_digest run --wildberries --since "$(date -d '14 days ago' +%F)" --send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WB_FEEDBACKS_TOKEN: ${{ secrets.WB_FEEDBACKS_TOKEN }}
